<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caçador de Vagas</title><style>body{font:16px system-ui;background:#0c1220;color:#eaf0ff;max-width:1050px;margin:40px auto;padding:0 20px}h1{font-size:2rem}p{color:#aebbd2}input{padding:13px;width:95%;max-width:600px;border:1px solid #45536a;border-radius:10px;background:#18243a;color:white}article{background:#18243a;border:1px solid #30415e;border-radius:14px;padding:20px;margin:16px 0}a{color:#8bc8ff}small{color:#b7c7db}.warning{background:#302617;padding:12px;border-radius:8px;color:#ffdda3}</style></head><body><h1>🔎 IA Caçador de Vagas</h1><p>Oportunidades remotas encontradas automaticamente. Atualização: <span id="atualizado">carregando...</span></p><p class="warning">Atenção: vagas remotas podem exigir residência fora do Brasil ou experiência. Confira os requisitos antes de se candidatar. Nunca pague para participar de seleção.</p><input id="filtro" placeholder="Filtrar por cargo, empresa ou local..." aria-label="Filtrar vagas"><p id="total"></p><main id="lista"></main><script>let vagas=[];const el=id=>document.getElementById(id);function render(){let q=el('filtro').value.toLocaleLowerCase('pt-BR');let lista=vagas.filter(v=>[v.titulo,v.empresa,v.local,v.descricao].join(' ').toLocaleLowerCase('pt-BR').includes(q));el('total').textContent=lista.length+' vagas para conferir';el('lista').replaceChildren(...lista.map(v=>{let a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),s=document.createElement('small'),link=document.createElement('a');h.textContent=v.titulo;p.textContent=v.descricao;s.textContent=(v.empresa||'Empresa não informada')+' · '+(v.local||'Local não informado');link.href=v.link;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Ver vaga original';a.append(h,s,p,link);return a}))}el('filtro').addEventListener('input',render);fetch('vagas.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('Dados indisponíveis');return r.json()}).then(d=>{vagas=d.vagas||[];el('atualizado').textContent=new Date(d.atualizado).toLocaleString('pt-BR');render()}).catch(()=>{el('atualizado').textContent='não disponível';el('total').textContent='Execute a primeira busca para gerar vagas.json'})</script></body></html>
